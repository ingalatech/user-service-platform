name: ci

on:
  push:
    branches: ['main']
  pull_request: {}

# Least-privilege for product CI: approving these runs must not expose
# write-capable repository credentials or secrets to product code/tests.
permissions:
  contents: read

jobs:
  gates:
    name: quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        # Ticket #82: PR runs must prove the exact PR HEAD, not the synthetic
        # merge commit. `pull_request` events set GITHUB_REF to
        # refs/pull/<n>/merge, so default checkout would test the merge SHA.
        # `push: main` keeps the normal event SHA. Actions expressions
        # propagate null through `&&`/`||`, so on push events (where
        # `github.event.pull_request` is absent) the left side yields null and
        # `|| github.sha` selects the event SHA. Do not reintroduce
        # branch-push CI to mask this; the expression below resolves to the PR
        # head SHA on pull_request and to the event SHA otherwise.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Ticket #246's migration compatibility test checks out the previous
          # Worker commit locally; no test performs a remote fetch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: OpenAPI drift check
        run: npm run openapi:check

      - name: Admin contract drift check
        run: npm run admin:contracts:check

      - name: Workers runtime tests
        run: npm run test

      - name: Node harness tests
        run: npm run test:harness
